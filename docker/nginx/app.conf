server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Lo público no sube archivos: 2M alcanza. Los 110M (= post_max_size de
    # docker/php/php.ini) quedan sólo para /uso-interno, más abajo. Con 110M en
    # todo el server cualquiera podía mandarle 110 MB a /carrito/agregar.
    client_max_body_size 2M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static assets — cache aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Storage files (imágenes subidas).
    # Apunta directamente al directorio del bind mount, sin depender del symlink.
    location /storage {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # File server (imágenes de producto vía SFTP). Se monta fileserver_*_data en :ro.
    # ^~ le da prioridad sobre la regex de assets estáticos (si no, /files/x.jpg la
    # capturaría esa regex y daría 404).
    # Cache de 1 año: los nombres de archivo llevan el id de imagenes_producto como
    # prefijo, así que una ruta nunca cambia de contenido. Sin esto cada visita
    # re-descarga todas las fotos del catálogo.
    location ^~ /files/ {
        alias /var/www/files/;
        try_files $uri =404;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
    }

    # PHP — all requests proxied to PHP-FPM (same container, 127.0.0.1)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sólo se ejecuta el front controller. Cualquier otro .php (por ejemplo uno
    # que alguien logre subir a public/) da 404 en vez de correr.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Igual a max_execution_time de docker/php/php.ini.
        fastcgi_read_timeout 120;
    }

    location ~ \.php$ {
        return 404;
    }

    # Panel: formularios con hasta 10 imágenes. Va directo a PHP-FPM y no por
    # try_files: el redirect interno a /index.php aplicaría el tope de 2M de
    # esa location. SCRIPT_NAME se pisa para que Laravel resuelva bien la URL
    # base (fastcgi_params lo arma con la URI).
    location ^~ /uso-interno/ {
        client_max_body_size 110M;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Block hidden files
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
